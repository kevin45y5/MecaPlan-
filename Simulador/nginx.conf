# ============================================================
# sugoi_project :: config nginx
# Sirve el frontend estático y hace proxy inverso a la API.
# El frontend llama SIEMPRE a /api/** dentro del mismo origen,
# evitando problemas de CORS desde el navegador.
# ============================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Charset correcto: asegura que todo el contenido estático se sirva
    # como UTF-8 (arregla mojibake tipo "CÃ³digo" en textos acentuados).
    charset utf-8;
    source_charset utf-8;

    # Gzip para payloads JSON más ligeros (pinout/BOM)
    gzip on;
    gzip_types application/json application/javascript text/css;

    # Proxy inverso hacia la API Node (red Docker interna)
    location /api/ {
        proxy_pass http://simulacion_2D_api:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s; # Gemini puede tardar
    }

    # SPA fallback: aunque aquí no hay rutas de historial, es seguro
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }

    # Asegurar MIME correcto. Al introducir tipos propios hay que "incluir"
    # el mapa MIME por defecto de nginx (text/javascript, text/css, wasm,
    # imágenes...); si no, todo quedaría como application/octet-stream y el
    # navegador bloquearía los <script type="module"> (página en blanco).
    include /etc/nginx/mime.types;
    types {
        application/javascript mjs;
        application/wasm wasm;
    }
    default_type application/octet-stream;

    # Assets estáticos con cache largo. IMPORTANTE: .mjs y .wasm deben servirse
    # con su MIME real (application/javascript / application/wasm); de lo
    # contrario el SPA fallback devolvería HTML y los import() del compilador
    # avr-gcc y de avr8js fallarían con "Failed to fetch ... module".
    location ~* \.(mjs|js|css|png|jpg|jpeg|gif|svg|woff2?|wasm|o|a)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
